<!DOCTYPE html>
<html>
<head>
    <title>Video Analytics - Face Detection</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 40px;
            text-align: center;
        }

        section {
            margin-bottom: 50px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        img {
            margin-top: 20px;
            max-width: 700px;
            border: 2px solid #333;
        }

        .live-count {
            font-size: 24px;
            font-weight: bold;
            color: green;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<h1>Face Detection Web App</h1>

<!-- ================= IMAGE SECTION ================= -->

<section>
    <h2>Image Upload</h2>

    <input type="file" id="imageInput" accept="image/*">
    <br><br>

    <button onclick="uploadImage()">Detect Faces</button>

    <div id="imageResult"></div>
    <img id="imageOutput">
</section>

<hr>

<!-- ================= VIDEO SECTION ================= -->

<section>
    <h2>Video Upload</h2>

    <input type="file" id="videoInput" accept="video/*">
    <br><br>

    <button onclick="uploadVideo()">Process Video</button>

    <div class="live-count" id="liveCount">
        Faces: 0
    </div>

    <img id="videoStream">
</section>

<script>

let pollingInterval = null;

/* ================= IMAGE ================= */

async function uploadImage() {
    const file = document.getElementById("imageInput").files[0];
    if (!file) return alert("Select image first");

    const formData = new FormData();
    formData.append("file", file);

    const response = await fetch("/face/image", {
        method: "POST",
        body: formData
    });

    const data = await response.json();

    document.getElementById("imageResult").innerHTML =
        <h3>Face Count: ${data.face_count}</h3>;

    document.getElementById("imageOutput").src =
        "data:image/jpeg;base64," + data.image_base64;
}


/* ================= VIDEO ================= */

async function uploadVideo() {
    const file = document.getElementById("videoInput").files[0];
    if (!file) return alert("Select video first");

    const formData = new FormData();
    formData.append("file", file);

    const response = await fetch("/face/video", {
        method: "POST",
        body: formData
    });

    const data = await response.json();

    document.getElementById("videoStream").src = data.stream_url;

    startPolling();
}

function startPolling() {
    if (pollingInterval) clearInterval(pollingInterval);

    pollingInterval = setInterval(async () => {
        const response = await fetch("/face/video/count");
        const data = await response.json();

        document.getElementById("liveCount").innerText =
            "Faces: " + data.face_count;

    }, 500);
}

</script>

</body>
</html>
