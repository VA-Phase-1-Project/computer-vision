<!DOCTYPE html>
<html>
<head>
  <title>Face Detection Web App</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 40px; }
    hr { margin: 40px 0; }
    #videoStream {
      width: 80%;
      max-width: 1100px;
      border: 2px solid #111;
      background: #f2f2f2;
      height: auto;
      object-fit: contain;   /* IMPORTANT: prevents stretching */
    }
    #imageResult {
      width: 80%;
      max-width: 900px;
      height: auto;
      object-fit: contain;
    }
    button { padding: 7px 14px; margin-left: 10px; }
    #status, #imageStatus { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

<h1>Face Detection Web App</h1>

<h2>Image Upload</h2>
<input type="file" id="imageInput" accept="image/*">
<button onclick="uploadImage()">Detect Faces</button>
<div id="imageStatus"></div>
<img id="imageResult" />

<hr>

<h2>Video Upload</h2>
<input type="file" id="videoInput" accept="video/*">
<button onclick="processVideo()">Process Video</button>

<h3 id="faceCountText">Live: 0 | Unique: 0</h3>
<div id="status"></div>
<img id="videoStream" />

<script>
let countInterval = null;
let currentFileName = null;

async function uploadImage() {
  const file = document.getElementById("imageInput").files[0];
  if (!file) return alert("Select image first");

  document.getElementById("imageStatus").innerText = "Uploading...";

  const fd = new FormData();
  fd.append("file", file);

  const res = await fetch("/face/upload/image", { method: "POST", body: fd });
  if (!res.ok) {
    document.getElementById("imageStatus").innerText = "Upload failed";
    return;
  }

  const data = await res.json();
  document.getElementById("imageResult").src = `/face/image/annotated/${data.file_name}`;
  document.getElementById("imageStatus").innerText = "Done";
}

async function processVideo() {
  const file = document.getElementById("videoInput").files[0];
  if (!file) return alert("Select video first");

  document.getElementById("status").innerText = "Uploading...";
  document.getElementById("videoStream").src = "";
  document.getElementById("faceCountText").innerText = "Live: 0 | Unique: 0";

  if (countInterval) clearInterval(countInterval);

  const fd = new FormData();
  fd.append("file", file);

  const uploadRes = await fetch("/face/upload/video", { method: "POST", body: fd });
  if (!uploadRes.ok) {
    document.getElementById("status").innerText = "Video upload failed";
    return;
  }

  const uploadData = await uploadRes.json();
  currentFileName = uploadData.file_name;

  document.getElementById("status").innerText = "Streaming + detecting...";
  document.getElementById("videoStream").src = `/face/video/stream/${currentFileName}`;

  countInterval = setInterval(updateCount, 1000);
}

async function updateCount() {
  const res = await fetch("/face/video/count");
  if (!res.ok) return;
  const data = await res.json();

  document.getElementById("faceCountText").innerText =
    `Live: ${data.current_face_count} | Unique: ${data.total_unique_faces}`;

  if (!data.is_active && data.last_error) {
    document.getElementById("status").innerText = "Stopped: " + data.last_error;
    clearInterval(countInterval);
  }
}
</script>

</body>
</html>
