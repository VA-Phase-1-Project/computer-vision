<!DOCTYPE html>
<html>
<head>
    <title>Face Detection Web App</title>
</head>
<body>

<h1>Face Detection Web App</h1>

<h2>Image Upload</h2>
<input type="file" id="imageInput">
<button onclick="uploadImage()">Detect Faces</button>
<br><br>
<img id="imageResult" width="500">

<hr>

<h2>Video Upload</h2>
<input type="file" id="videoInput">
<button onclick="uploadVideo()">Process Video</button>
<h3 id="faceCount">Faces: 0</h3>
<img id="videoStream" width="500">

<script>

async function uploadImage() {
    const file = document.getElementById("imageInput").files[0];
    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/upload/image", {
        method: "POST",
        body: formData
    });

    const data = await res.json();
    document.getElementById("imageResult").src =
        `/image/${data.file_name}`;
}

async function uploadVideo() {
    const file = document.getElementById("videoInput").files[0];
    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/upload/video", {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    document.getElementById("videoStream").src =
        `/video/stream/${data.file_name}`;

    setInterval(async () => {
        const countRes = await fetch("/video/count");
        const countData = await countRes.json();
        document.getElementById("faceCount").innerText =
            `Faces: ${countData.faces}`;
    }, 1000);
}

</script>

</body>
</html>
